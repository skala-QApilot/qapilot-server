# 로컬 개발 시: ./gradlew bootRun --args="--spring.profiles.active=dev"
# dev 프로필 활성화 시 admin@qapilot.com / admin1234 시드 (DevTestUserSeeder)
server:
  port: 8080

spring:
  application:
    name: qapilot-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/qapilot}
    username: ${POSTGRES_USER:qapilot}
    password: ${POSTGRES_PASSWORD:qapilot}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate     # Flyway 가 스키마 소유자. JPA 는 매핑 검증만.
    open-in-view: false
    properties:
      "[hibernate.jdbc.time_zone]": Asia/Seoul   # KST — 한국 사용자 only 정책
  jackson:
    time-zone: Asia/Seoul                          # API 응답 ISO 8601 KST offset 표기
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

aws:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:qapilot-local}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}

qapilot:
  storage:
    default-target-root: ${QAPILOT_TARGET_ROOT:.}
  fastapi:
    base-url: ${QAPILOT_FASTAPI_BASE_URL:http://localhost:8001}
    internal-api-token: ${QAPILOT_INTERNAL_API_TOKEN:}
  slack:
    bot-token: ${SLACK_BOT_TOKEN:}
  cors:
    allowed-origins: ${QAPILOT_CORS_ALLOWED_ORIGINS:http://localhost:5173}
